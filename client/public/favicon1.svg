<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Smooth diagonal gradient matching the purple/indigo hues -->
    <linearGradient id="purpleGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#32185c" />
      <stop offset="45%" stop-color="#7a62b8" />
      <stop offset="85%" stop-color="#ab82db" />
      <stop offset="100%" stop-color="#cc9bf2" />
    </linearGradient>
  </defs>

  <!-- Background shape: "D" with rounded corners -->
  <path 
    d="M 64 64 
       L 320 64 
       A 192 192 0 0 1 320 448 
       L 64 448 
       Z" 
    fill="url(#purpleGradient)" 
    rx="32" 
    ry="32"
  />

  <!-- Bold white sans-serif letter "T" -->
  <text 
    x="232" 
    y="380" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="370" 
    fill="#ffffff" 
    text-anchor="middle"
  >T</text>
</svg>
